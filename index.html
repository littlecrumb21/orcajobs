<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Orca Jobs — Isle of Wight</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,300..700&family=Manrope:wght@300..800&display=swap" rel="stylesheet">

<style>
  /* ─────────────── reset ─────────────── */
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family: var(--font-body);
    color: var(--ink);
    background: var(--bg);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    font-size: 15px;
    line-height: 1.5;
  }
  button{font-family:inherit;color:inherit}
  input,textarea,select{font-family:inherit;color:inherit;font-size:inherit}
  a{color:inherit;text-decoration:none}
  ::selection{background:var(--accent);color:var(--accent-ink)}

  /* ─────────────── theme tokens (default = SOLENT) ─────────────── */
  :root,
  .theme-solent{
    --bg: #f6f4ef;
    --bg-2: #ffffff;
    --bg-soft: #ece8df;
    --ink: #0f1d2c;
    --ink-2: #2c3a4a;
    --muted: #6e7886;
    --line: rgba(15,29,44,.10);
    --line-2: rgba(15,29,44,.18);
    --card: #ffffff;
    --accent: #ff6a4d;          /* warm coral */
    --accent-ink: #ffffff;
    --accent-soft: #ffe4dc;
    --good: #1f8a5b;
    --warn: #c89324;
    --bad:  #c0473d;
    --chip: #eee9de;

    --font-display: "Newsreader", Georgia, serif;
    --font-body:    "Geist", ui-sans-serif, system-ui, sans-serif;
    --font-mono:    "Geist Mono", ui-monospace, monospace;

    --radius-s: 6px;
    --radius:   10px;
    --radius-l: 18px;

    --shadow-s: 0 1px 0 rgba(15,29,44,.04);
    --shadow:   0 4px 18px -8px rgba(15,29,44,.18), 0 1px 0 rgba(15,29,44,.04);
    --shadow-l: 0 22px 60px -28px rgba(15,29,44,.32), 0 2px 0 rgba(15,29,44,.05);
  }

  .theme-chalk{
    --bg: #fafaf7;
    --bg-2: #ffffff;
    --bg-soft: #efeee8;
    --ink: #0a0a0a;
    --ink-2: #2a2a2a;
    --muted: #6f6f6f;
    --line: rgba(0,0,0,.10);
    --line-2: rgba(0,0,0,.22);
    --card: #ffffff;
    --accent: #5b6cff;          /* electric */
    --accent-ink: #ffffff;
    --accent-soft: #e3e6ff;
    --good: #0f7a4a;
    --warn: #b07a00;
    --bad:  #b1382f;
    --chip: #ececec;

    --font-display: "Manrope", ui-sans-serif, sans-serif;
    --font-body:    "Manrope", ui-sans-serif, system-ui, sans-serif;
    --font-mono:    "Geist Mono", ui-monospace, monospace;
  }

  .theme-tide{
    --bg: #0c1320;
    --bg-2: #121b2c;
    --bg-soft: #1a2638;
    --ink: #f4ece0;
    --ink-2: #cdd5e2;
    --muted: #8a93a3;
    --line: rgba(244,236,224,.10);
    --line-2: rgba(244,236,224,.20);
    --card: #131e30;
    --accent: #f6c177;          /* sand gold */
    --accent-ink: #11192a;
    --accent-soft: rgba(246,193,119,.16);
    --good: #6dd6a4;
    --warn: #f4c25a;
    --bad:  #ef7c70;
    --chip: rgba(244,236,224,.08);

    --font-display: "Instrument Serif", Georgia, serif;
    --font-body:    "DM Sans", ui-sans-serif, system-ui, sans-serif;
    --font-mono:    "Geist Mono", ui-monospace, monospace;
  }

  /* ─────────────── primitives ─────────────── */
  .wrap{max-width:1240px;margin:0 auto;padding:0 28px}
  .stack{display:flex;flex-direction:column}
  .row{display:flex;align-items:center}
  .gap-2{gap:8px}.gap-3{gap:12px}.gap-4{gap:16px}.gap-5{gap:20px}.gap-6{gap:24px}.gap-8{gap:32px}
  .grow{flex:1 1 auto}
  .mono{font-family:var(--font-mono);font-size:.84em;letter-spacing:.01em}
  .display{font-family:var(--font-display);font-weight:400;letter-spacing:-.02em;line-height:1.02}
  .h1{font-family:var(--font-display);font-weight:400;font-size:64px;line-height:1.02;letter-spacing:-.025em}
  .h2{font-family:var(--font-display);font-weight:400;font-size:40px;line-height:1.05;letter-spacing:-.02em}
  .h3{font-family:var(--font-display);font-weight:500;font-size:24px;line-height:1.15;letter-spacing:-.01em}
  .h4{font-weight:600;font-size:17px;letter-spacing:-.005em}
  .lede{font-size:18px;color:var(--ink-2);line-height:1.5;text-wrap:pretty}
  .micro{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--muted)}
  .small{font-size:13px;color:var(--muted)}

  /* per-theme display tweaks */
  .theme-chalk .h1{font-weight:700;letter-spacing:-.04em}
  .theme-chalk .h2{font-weight:700;letter-spacing:-.03em}
  .theme-chalk .h3{font-weight:700;letter-spacing:-.02em}
  .theme-tide .h1{font-style:italic;letter-spacing:-.015em}
  .theme-tide .h2{font-style:italic}

  /* buttons */
  .btn{
    --bh: 40px;
    appearance:none;border:0;background:var(--ink);color:var(--bg);
    height:var(--bh);padding:0 16px;border-radius:999px;
    font-weight:500;font-size:14px;letter-spacing:-.005em;
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    cursor:pointer;transition:transform .08s ease, background .12s ease, color .12s ease, border-color .12s ease;
    white-space:nowrap;
  }
  .btn:hover{transform:translateY(-1px)}
  .btn:active{transform:translateY(0)}
  .btn.primary{background:var(--accent);color:var(--accent-ink)}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line-2)}
  .btn.ghost:hover{background:var(--bg-soft)}
  .btn.subtle{background:var(--bg-soft);color:var(--ink)}
  .btn.sm{--bh:32px;padding:0 12px;font-size:13px}
  .btn.lg{--bh:48px;padding:0 22px;font-size:15px}
  .btn.block{display:flex;width:100%}
  .btn[disabled]{opacity:.5;cursor:not-allowed}

  /* inputs */
  .field{display:flex;flex-direction:column;gap:6px}
  .field>label{font-size:12px;font-weight:600;color:var(--ink-2);letter-spacing:-.005em}
  .field>label .req{color:var(--accent);margin-left:2px}
  .field>label .hint{color:var(--muted);font-weight:400;margin-left:6px;font-size:11px}
  .input,.textarea,.select{
    background:var(--card);color:var(--ink);
    border:1px solid var(--line-2);border-radius:var(--radius);
    padding:11px 12px;font-size:14px;line-height:1.3;
    transition:border-color .12s ease, box-shadow .12s ease;
    width:100%;
  }
  .input:focus,.textarea:focus,.select:focus{
    outline:none;border-color:var(--ink);box-shadow:0 0 0 3px var(--accent-soft);
  }
  .textarea{min-height:90px;resize:vertical}
  .input.sm{padding:8px 10px;font-size:13px}
  .checkbox,.radio{display:inline-flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--ink-2);cursor:pointer;user-select:none}
  .checkbox input,.radio input{margin:2px 0 0 0;accent-color:var(--accent)}

  /* card */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-l);box-shadow:var(--shadow-s)}
  .card.elev{box-shadow:var(--shadow)}
  .pad-4{padding:16px}.pad-5{padding:20px}.pad-6{padding:24px}.pad-7{padding:28px}.pad-8{padding:32px}

  /* badge / chip */
  .badge{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:500;background:var(--chip);color:var(--ink-2);letter-spacing:.005em}
  .badge.dot::before{content:"";width:6px;height:6px;border-radius:99px;background:currentColor;display:inline-block}
  .badge.accent{background:var(--accent-soft);color:var(--accent)}
  .theme-tide .badge.accent{color:var(--accent)}
  .badge.good{background:color-mix(in srgb, var(--good) 16%, transparent);color:var(--good)}
  .badge.warn{background:color-mix(in srgb, var(--warn) 18%, transparent);color:var(--warn)}
  .badge.bad{background:color-mix(in srgb, var(--bad) 16%, transparent);color:var(--bad)}
  .badge.outline{background:transparent;border:1px solid var(--line-2);color:var(--ink-2)}

  /* divider */
  .hr{height:1px;background:var(--line);border:0;margin:0}
  .vr{width:1px;background:var(--line);align-self:stretch}

  /* image-slot stand-in (placeholder) */
  .ph{
    position:relative;background:
      repeating-linear-gradient(135deg, var(--bg-soft) 0 8px, transparent 8px 16px),
      var(--bg-2);
    border:1px dashed var(--line-2);border-radius:var(--radius);
    display:flex;align-items:center;justify-content:center;
    color:var(--muted);
    font-family:var(--font-mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;
  }
  .ph.round{border-radius:999px}

  /* nav active link */
  .nav-link{font-size:14px;color:var(--ink-2);padding:6px 10px;border-radius:8px;cursor:pointer;font-weight:500;letter-spacing:-.005em}
  .nav-link:hover{color:var(--ink);background:var(--bg-soft)}
  .nav-link.active{color:var(--ink);background:var(--bg-soft)}

  /* tag-list */
  .tags{display:flex;flex-wrap:wrap;gap:6px}

  /* layout helpers */
  .grid{display:grid}
  .center{display:flex;align-items:center;justify-content:center}

  /* avatar */
  .avatar{width:36px;height:36px;border-radius:99px;background:var(--bg-soft);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;color:var(--ink-2);border:1px solid var(--line)}

  /* progress bar */
  .progress{position:relative;height:6px;background:var(--bg-soft);border-radius:99px;overflow:hidden}
  .progress>div{position:absolute;inset:0;background:var(--accent);transform-origin:left;transition:transform .25s ease}

  /* toast */
  @keyframes slideup{from{transform:translateY(20px) translateX(-50%);opacity:0}to{transform:translateY(0) translateX(-50%);opacity:1}}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:99px;font-size:14px;z-index:200;animation:slideup .2s ease;box-shadow:var(--shadow-l)}
  .theme-tide .toast{background:var(--accent);color:var(--accent-ink)}

  /* sea band — used in solent home hero */
  .sea-band{
    position:absolute;inset:auto 0 0 0;height:42%;
    background:
      radial-gradient(120% 80% at 50% 0%, transparent 0, var(--bg-soft) 70%),
      linear-gradient(180deg, transparent, var(--bg-soft));
    pointer-events:none;
  }

  /* svg icon */
  .ic{width:16px;height:16px;display:inline-block;flex:0 0 auto}
  .ic.lg{width:20px;height:20px}
  .ic.xl{width:28px;height:28px}

  /* table */
  .tbl{width:100%;border-collapse:collapse;font-size:13.5px}
  .tbl th{font-weight:500;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
  .tbl td{padding:14px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
  .tbl tr:hover td{background:var(--bg-soft)}

  /* sidebar nav */
  .side-link{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;font-size:14px;color:var(--ink-2);cursor:pointer;font-weight:500}
  .side-link:hover{background:var(--bg-soft);color:var(--ink)}
  .side-link.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
  .theme-tide .side-link.active{color:var(--accent)}

  /* skeleton fade-in for screen transitions */
  @keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  .screen{animation:fadein .22s ease both}

  /* cookie banner */
  .cookie-banner{
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:90;
    max-width:560px;width:calc(100% - 32px);
    background:var(--card);border:1px solid var(--line-2);border-radius:18px;
    box-shadow:var(--shadow-l);padding:18px 20px;
    display:flex;flex-direction:column;gap:14px;
  }

  /* job card hover */
  .job-card{transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease;cursor:pointer}
  .job-card:hover{transform:translateY(-1px);box-shadow:var(--shadow);border-color:var(--line-2)}

  /* theme-specific hero treatments */
  .theme-chalk .hero-grid{
    background-image:linear-gradient(var(--line) 1px,transparent 1px),
                     linear-gradient(90deg, var(--line) 1px,transparent 1px);
    background-size: 32px 32px;
  }

  /* image-slot styling */
  image-slot{display:block}

  /* checkout summary lines */
  .sum-row{display:flex;justify-content:space-between;font-size:14px;padding:6px 0}
  .sum-row.total{border-top:1px solid var(--line);padding-top:12px;margin-top:8px;font-weight:600;font-size:16px}

  /* admin status pills */
  .pill-status{font-size:11px;font-weight:600;padding:3px 8px;border-radius:99px;display:inline-flex;align-items:center;gap:5px}
</style>

<script>
  // Suppress benign ResizeObserver loop notification (browser-emitted, not from app code)
  window.onerror = function(msg){ if(typeof msg==='string' && msg.indexOf('ResizeObserver')!==-1) return true; };
  window.addEventListener("error",e=>{if(!e.message || /ResizeObserver/.test(e.message)){e.stopImmediatePropagation();e.preventDefault();return true;}},true);
  window.addEventListener("unhandledrejection",e=>{if(/ResizeObserver/.test(String(e.reason))){e.stopImmediatePropagation();e.preventDefault();}},true);
  const _ce=console.error;console.error=function(){if(arguments[0]&&/ResizeObserver/.test(String(arguments[0])))return;_ce.apply(console,arguments);};
  // Wrap ResizeObserver to defer callbacks to next frame, eliminating loop errors
  if (window.ResizeObserver) {
    const _RO = window.ResizeObserver;
    window.ResizeObserver = class extends _RO {
      constructor(cb){ super((entries,obs)=>{ if(window.requestAnimationFrame) requestAnimationFrame(()=>{ try{cb(entries,obs);}catch(_){} }); else try{cb(entries,obs);}catch(_){} }); }
    };
  }
  </script>

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', noDeckControls = false, children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  // Auto-inject a rail toggle when a <deck-stage> is on the page. The
  // toggle drives the deck's per-viewer _railVisible via window message;
  // state is mirrored from the same localStorage key the deck reads so
  // the control reflects reality across reloads. The mechanism is the
  // message — authors who want custom placement can post it directly
  // and pass noDeckControls to suppress this one.
  const hasDeckStage = React.useMemo(
    () => typeof document !== 'undefined' && !!document.querySelector('deck-stage'),
    [],
  );
  // Hide the toggle until the host has actually enabled the rail (the
  // __omelette_rail_enabled window message, posted only when the
  // omelette_deck_rail_enabled flag is on for this user). The initial read
  // covers TweaksPanel mounting after the message already arrived; the
  // listener covers the common case of mounting first.
  const [railEnabled, setRailEnabled] = React.useState(
    () => hasDeckStage && !!document.querySelector('deck-stage')?._railEnabled,
  );
  React.useEffect(() => {
    if (!hasDeckStage || railEnabled) return undefined;
    const onMsg = (e) => {
      if (e.data && e.data.type === '__omelette_rail_enabled') setRailEnabled(true);
    };
    window.addEventListener('message', onMsg);
    return () => window.removeEventListener('message', onMsg);
  }, [hasDeckStage, railEnabled]);
  const [railVisible, setRailVisible] = React.useState(() => {
    try { return localStorage.getItem('deck-stage.railVisible') !== '0'; } catch (e) { return true; }
  });
  const toggleRail = (on) => {
    setRailVisible(on);
    window.postMessage({ type: '__deck_rail_visible', on }, '*');
  };
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(()=>requestAnimationFrame(()=>clampToViewport()));
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
          {hasDeckStage && railEnabled && !noDeckControls && (
            <TweakSection label="Deck">
              <TweakToggle label="Thumbnail rail" value={railVisible} onChange={toggleRail} />
            </TweakSection>
          )}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

// ─── Buttons / inputs ───────────────────────────────────────────────
function Button({ as = "button", variant = "primary", size, block, icon, iconAfter, children, className = "", ...rest }) {
  const C = as;
  const classes = [
    "btn",
    variant === "primary" ? "primary" : variant === "ghost" ? "ghost" : variant === "subtle" ? "subtle" : variant === "dark" ? "" : "",
    size === "sm" ? "sm" : size === "lg" ? "lg" : "",
    block ? "block" : "", className
  ].filter(Boolean).join(" ");
  return (
    <C className={classes} {...rest}>
      {icon ? <Icon name={icon} /> : null}
      {children}
      {iconAfter ? <Icon name={iconAfter} /> : null}
    </C>
  );
}

function Field({ label, hint, required, children, full }) {
  return (
    <div className="field" style={full ? { gridColumn: "1 / -1" } : null}>
      <label>
        {label}{required ? <span className="req">*</span> : null}
        {hint ? <span className="hint">{hint}</span> : null}
      </label>
      {children}
    </div>
  );
}

function Input(props) { return <input className={`input ${props.className||""}`} {...props} />; }
function Textarea(props) { return <textarea className={`textarea ${props.className||""}`} {...props} />; }
function Select({ children, ...rest }) { return <select className="select" {...rest}>{children}</select>; }

        <Button variant="ghost" size="sm" onClick={onClose}>Reject non-essential</Button>
        <Button variant="primary" size="sm" onClick={onClose}>Accept all</Button>

}

function ConsentRow({ title, desc, checked, onChange, disabled }) {
  return (
    <div className="row gap-3" style={{ alignItems:"flex-start" }}>
      <div className="grow stack" style={{ gap:2 }}>
        <div style={{ fontWeight:600, fontSize:13 }}>{title}</div>
        <div className="small">{desc}</div>
      </div>
      <Toggle checked={!!checked} disabled={disabled} onChange={onChange}/>
    </div>
  );
}

function Toggle({ checked, onChange, disabled }) {
  return (
    <button
      onClick={() => !disabled && onChange && onChange(!checked)}
      disabled={disabled}
      style={{
        width:38, height:22, borderRadius:99, border:"1px solid var(--line-2)",
        background: checked ? "var(--accent)" : "var(--bg-soft)",
        position:"relative", cursor: disabled ? "not-allowed" : "pointer", transition:"background .15s",
        opacity: disabled ? .5 : 1, padding:0,
      }}
      aria-pressed={checked}
    >
      <span style={{
        position:"absolute", top:2, left: checked ? 18 : 2,
        width:16, height:16, borderRadius:99, background:"#fff",
        boxShadow:"0 1px 3px rgba(0,0,0,.18)", transition:"left .15s",
      }}/>
    </button>
  );
}

function SearchScreen({ go, params }) {
  const [q, setQ] = pUseState(params.q || "");
  const [where, setWhere] = pUseState(params.where || "");
  const [type, setType] = pUseState("");
  const [salary, setSalary] = pUseState(0);
  const [view, setView] = pUseState("list");
  const [sort, setSort] = pUseState("relevance");

  const filtered = pUseMemo(() => {
    return JOBS.filter(j => {
      if (q && !(`${j.title} ${j.company} ${j.skills.join(" ")}`.toLowerCase().includes(q.toLowerCase()))) return false;
      if (where && j.location !== where) return false;
      if (type && j.type !== type) return false;
      if (salary && j.salaryNum < salary) return false;
      return true;
    }).sort((a,b) => sort === "salary" ? b.salaryNum - a.salaryNum : sort === "recent" ? 0 : (b.featured?1:0) - (a.featured?1:0));
  }, [q, where, type, salary, sort]);

  return (
    <div className="screen wrap" style={{ paddingTop:32, paddingBottom:40 }}>
      <div className="card pad-5 row gap-3" style={{ borderRadius:14 }}>
        <div className="row gap-2 grow" style={{ paddingLeft:8 }}>
          <Icon name="search" size={18}/>
          <input className="input" style={{ border:0, background:"transparent", padding:0 }} placeholder="Title, skill, company" value={q} onChange={e=>setQ(e.target.value)}/>
        </div>
        <div className="vr" style={{ height:24 }}/>
        <div className="row gap-2" style={{ width:200, padding:"0 8px" }}>
          <Icon name="pin" size={18}/>
          <select className="select" style={{ border:0, background:"transparent", padding:0 }} value={where} onChange={e=>setWhere(e.target.value)}>
            <option value="">Anywhere on the island</option>
            {TOWNS.map(t => <option key={t} value={t}>{t}</option>)}
          </select>
        </div>
        <Button variant="primary">Search</Button>
      </div>

      <div style={{ display:"grid", gridTemplateColumns:"260px 1fr", gap:24, marginTop:24 }}>
        <aside className="stack gap-5">
          <div className="stack gap-3">
            <div className="micro">Filters</div>
            <div className="field">
              <label>Job type</label>
              <select className="select" value={type} onChange={e=>setType(e.target.value)}>
                <option value="">All types</option>
                <option>Full-time</option>
                <option>Part-time</option>
                <option>Seasonal</option>
                <option>Contract</option>
              </select>
            </div>
            <div className="field">
              <label>Min salary <span className="hint">£{salary.toLocaleString()}</span></label>
              <input type="range" min="0" max="60000" step="2500" value={salary} onChange={e=>setSalary(+e.target.value)} style={{ accentColor:"var(--accent)" }}/>
            </div>
            <div className="field">
              <label>Working pattern</label>
              <div className="stack gap-2">
                {["Remote","Hybrid","On-site"].map(o => (
                  <label key={o} className="checkbox"><input type="checkbox"/> {o}</label>
                ))}
              </div>
            </div>
            <div className="field">
              <label>Posted</label>
              <div className="stack gap-2">
                {["Last 24 hours","Last 7 days","Last 30 days"].map(o => (
                  <label key={o} className="radio"><input type="radio" name="posted"/> {o}</label>
                ))}
              </div>
            </div>
          </div>
          <div className="card pad-5 stack gap-2" style={{ background:"var(--bg-soft)", border:0 }}>
            <div className="row gap-2"><Icon name="bell" size={14}/><b style={{ fontSize:13 }}>Job alerts</b></div>
            <div className="small">Email me when new roles match these filters.</div>
            <Button size="sm" variant="ghost" block>Create alert</Button>
          </div>
        </aside>

        <div className="stack gap-3">
          <div className="row" style={{ justifyContent:"space-between" }}>
            <div className="row gap-3">
              <div><b>{filtered.length}</b> <span className="small">jobs</span></div>
              <div className="small" style={{ color:"var(--muted)" }}>{q ? `for "${q}"` : ""}{where ? ` in ${where}` : ""}</div>
            </div>
            <div className="row gap-2">

                <option value="relevance">Most relevant</option>
                <option value="recent">Most recent</option>
                <option value="salary">Highest salary</option>
              </select>
              <div className="row" style={{ background:"var(--bg-soft)", borderRadius:8, padding:2 }}>
                <button className="nav-link" style={{ padding:6, background: view==="list"?"var(--card)":"transparent" }} onClick={()=>setView("list")}><Icon name="list"/></button>
                <button className="nav-link" style={{ padding:6, background: view==="grid"?"var(--card)":"transparent" }} onClick={()=>setView("grid")}><Icon name="grid"/></button>
              </div>
            </div>
          </div>
          <div style={{ display: view==="grid"?"grid":"flex", gridTemplateColumns: view==="grid"?"1fr 1fr":undefined, flexDirection: view==="list"?"column":undefined, gap:12 }}>
            {filtered.map(j => <JobCard key={j.id} job={j} go={go} variant={view==="grid"?"compact":"default"}/>)}

        </div>
      </div>
    </div>
  );

            <div style={{ fontSize:12, fontWeight: i===step?600:400, color: i===step?"var(--ink)":"var(--muted)" }}>{s}</div>

      <div className="card pad-7 stack gap-5">

                <div className="grow stack" style={{ gap:2 }}>
                  <b>{APPLICANT.firstName} {APPLICANT.lastName}</b>
                  <div className="small">{APPLICANT.headline}</div>
                  <div className="small">{APPLICANT.location} · {APPLICANT.email} · {APPLICANT.phone}</div>

              </div>
              <div className="hr"/>

                <span><b>Right to work:</b> {APPLICANT.rightToWork}</span>
                <span><b>Available:</b> {APPLICANT.availability}</span>
                <span><b>Expected:</b> £{APPLICANT.expectedSalary.toLocaleString()}</span>
              </div>
              <div className="row gap-2"><Icon name="file" size={14}/><span className="small">{APPLICANT.cv.name}</span></div>
            </div>
            <label className="checkbox"><input type="checkbox" defaultChecked/> Include my video introduction</label>
          </div>
        ) : null}

        {step === 1 ? (
          <div className="stack gap-4">
            <h2 className="h3" style={{ margin:0 }}>Cover letter</h2>
            <p className="small">Optional but recommended. {job.company} likes a personal note.</p>

              <Textarea value={coverLetter} onChange={e=>setCoverLetter(e.target.value)} style={{ minHeight:200 }}/>
            </Field>
            <div className="row gap-2">
              <Button variant="ghost" size="sm" icon="sparkle">Improve with AI</Button>
              <Button variant="ghost" size="sm">Use template</Button>
            </div>
          </div>

        {step === 2 ? (
          <div className="stack gap-4">
            <h2 className="h3" style={{ margin:0 }}>Screening questions</h2>
            <p className="small">Set by the employer. Answers are sent only to {job.company}.</p>
            {[
              "Do you have at least 3 years experience leading a front-of-house team?",
              "Are you available to start within 4 weeks?",
              "Tell us about a time you handled a difficult guest situation."
            ].map((q, i) => (
              <Field key={i} label={`${i+1}. ${q}`} required>
                {i === 2 ? <Textarea value={answers[i]} onChange={e=>setAnswers(a => a.map((v,j)=>j===i?e.target.value:v))} placeholder="A few sentences"/> : (

        {step === 3 ? (
          <div className="stack gap-4">

          </div>

            if (step < steps.length-1) setStep(step+1);
            else { toast("Application sent — good luck!"); go("applicant-dashboard"); }
          }}>{step < steps.length-1 ? "Continue" : "Submit application"}</Button>
        </div>
      </div>
    </div>
  );
}

          </div>
        ) : null}

        {step === 3 ? (
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:14, marginBottom:20 }}>
            {[
              { id:"self", t:"Self‑serve", price:"£29 / post", body:"You write the advert, review applicants, run interviews. Best for roles you know well." },
              { id:"managed", t:"Managed", price:"18% of salary", body:"A consultant takes the brief, shortlists three to five, you only meet the top of the pile.", primary:true },
            ].map(o => (
              <div key={o.id} className="card" style={{ padding:18, borderColor: o.primary ? "var(--accent)" : "var(--line)", background: o.primary ? "color-mix(in srgb, var(--accent) 5%, var(--surface))" : "var(--surface)" }}>
                <div className="row" style={{ justifyContent:"space-between", marginBottom:6 }}>
                  <div style={{ fontWeight:600 }}>{o.t}</div>
                  <span className="badge outline mono" style={{ fontSize:10 }}>{o.price}</span>
                </div>
                <div className="small" style={{ color:"var(--ink-2)" }}>{o.body}</div>
              </div>
            ))}
          </div>
        ) : null}

        <div className="row gap-2" style={{ marginTop:8 }}>
          {step > 0 ? <Button variant="ghost" onClick={() => setStep(step-1)}>Back</Button> : null}
          <div className="grow"/>
          <Button variant="ghost" onClick={() => go("employer-dashboard")}>Skip</Button>
          {s.final
            ? <Button variant="primary" onClick={() => go("employer-dashboard")}>Finish setup</Button>
            : <Button variant="primary" onClick={() => setStep(step+1)}>Next ›</Button>}
        </div>
      </div>
    </div>
  );
}

//─── app.jsx ───
// Root app: routing + theme + tweaks panel + cookie banner

const { useState: appUseState, useEffect: appUseEffect } = React;

function App() {
  const [t, setTweak] = useTweaks(window.__TWEAKS);
  const [route, setRoute] = appUseState("home");
  const [params, setParams] = appUseState({});
  const [role, setRole] = appUseState("public");
  const [cookieOpen, setCookieOpen] = appUseState(true);
  const [toastMsg, setToastMsg] = appUseState(null);

  const go = (r, p = {}) => {
    setRoute(r);
    setParams(p);
    if (r === "applicant-signup") setRole("public");
    if (r === "applicant-dashboard" || r === "applicant-profile") setRole("applicant");
    if (r === "employer-dashboard" || r === "employer-jobs" || r === "employer-billing" || r === "post-job") setRole(role === "public" ? "employer" : role);
    if (r === "admin" || r === "admin-stats") setRole("admin");
    window.scrollTo({ top: 0, behavior: "instant" });
  };

  const toast = (msg) => {
    setToastMsg(msg);
    setTimeout(() => setToastMsg(null), 2400);
  };

  appUseEffect(() => {
    document.documentElement.classList.remove("theme-solent","theme-chalk","theme-tide");
    document.documentElement.classList.add(`theme-${t.theme}`);
  }, [t.theme]);

  return (
    <div>
      <TopNav route={route} go={go} role={role} setRole={setRole}/>

      {role === "public" && (route === "home") ? <HomeScreen go={go}/> : null}
      {(route === "search") ? <SearchScreen go={go} params={params}/> : null}
      {(route === "job-detail") ? <JobDetailScreen go={go} params={params}/> : null}
      {(route === "employers") ? <EmployersScreen go={go}/> : null}
      {(route === "about") ? <AboutScreen/> : null}

      {(route === "applicant-signup") ? <ApplicantSignupScreen go={go}/> : null}
      {(route === "applicant-dashboard") ? <ApplicantDashboardScreen go={go}/> : null}
      {(route === "applicant-profile") ? <ApplicantProfileScreen go={go}/> : null}
      {(route === "apply") ? <ApplyScreen go={go} params={params} toast={toast}/> : null}
      {(route === "privacy") ? <PrivacyCenterScreen/> : null}

      {(route === "employer-signup") ? <EmployerSignupScreen go={go}/> : null}
      {(route === "employer-dashboard") ? <EmployerDashboardScreen go={go}/> : null}
      {(route === "employer-jobs") ? <EmployerJobsScreen go={go}/> : null}
      {(route === "employer-billing") ? <EmployerBillingScreen/> : null}
      {(route === "post-job") ? <PostJobScreen go={go} params={params} toast={toast}/> : null}

      {(route === "admin") ? <AdminScreen go={go}/> : null}
      {(route === "admin-stats") ? <AdminStatsScreen/> : null}

      <Footer go={go}/>

      {cookieOpen && t.showCookieBanner ? <CookieBanner onClose={() => setCookieOpen(false)}/> : null}
      {toastMsg ? <div className="toast">{toastMsg}</div> : null}

      <TweaksPanel title="Tweaks">
        <TweakSection label="Visual direction"/>
        <TweakRadio label="Theme" value={t.theme} options={["solent","chalk","tide"]} onChange={(v)=>setTweak("theme", v)}/>
        <div className="small" style={{ color:"#666", marginTop:-4, fontSize:11, lineHeight:1.4 }}>
          {t.theme==="solent" ? "Editorial cream + coral · Newsreader serif" : t.theme==="chalk" ? "High-contrast minimal · Manrope · electric blue" : "Dark mode · Instrument Serif italic · sand gold"}
        </div>

        <TweakSection label="Platform model"/>
        <TweakRadio label="Mode" value={t.platformMode} options={["jobs_board","hybrid","agency"]}
                    onChange={(v) => { setTweak("platformMode", v); go(route); }}/>
        <div className="small" style={{ color:"#666", marginTop:-4, fontSize:11, lineHeight:1.4 }}>
          {t.platformMode==="agency" ? "Full recruitment agency · consultants, vetted candidates, placement fees" : t.platformMode==="hybrid" ? "Both: self‑serve £29 posts AND managed search" : "Pure marketplace · employers post, candidates apply direct"}
        </div>

        <TweakSection label="Demo as"/>
        <TweakRadio label="Role" value={role} options={["public","applicant","employer","admin"]}
                    onChange={(v) => {
                      setRole(v);
                      if (v === "applicant") go("applicant-dashboard");
                      else if (v === "employer") go("employer-dashboard");
                      else if (v === "admin") go("admin");
                      else go("home");
                    }}/>

        <TweakSection label="Jump to screen"/>
        <TweakSelect label="Public" value={route} options={["home","search","job-detail","services","specialisms","team","trust","compliance","employers","about","404"]} onChange={(v) => go(v, v==="job-detail"?{id:"j-001"}:{})}/>
        <TweakSelect label="Applicant" value={route} options={["applicant-signup","applicant-onboarding","applicant-dashboard","applicant-profile","apply","messages","privacy"]} onChange={(v) => { setRole(v==="applicant-signup"?"public":"applicant"); go(v, v==="apply"?{id:"j-001"}:{}); }}/>
        <TweakSelect label="Employer" value={route} options={["employer-signup","employer-onboarding","employer-dashboard","employer-jobs","employer-billing","post-job","messages"]} onChange={(v) => { setRole(v==="employer-signup"?"public":"employer"); go(v); }}/>
        <TweakSelect label="Admin" value={route} options={["admin","admin-stats"]} onChange={(v) => { setRole("admin"); go(v); }}/>

        <TweakSection label="UI"/>
        <TweakToggle label="Cookie banner" value={cookieOpen && t.showCookieBanner}
                     onChange={(v) => { setCookieOpen(v); setTweak("showCookieBanner", v); }}/>
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);


</script>
